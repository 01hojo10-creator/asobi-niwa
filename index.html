<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon.png?v=30">
<link rel="apple-touch-icon" type="image/png" href="icon.png?v=30">
<title>あそびのにわ</title>
<style>
:root{
  --spd:1; --glow:.6;
  --cream:#FFF4DC; --mint:#CFEBD9; --coral:#FF8A70; --wood:#C98F4E; --ink:#2C5D55;
  --mound1:#B98A52; --mound2:#8AC47E;
  --shadow:0 10px 0 rgba(70,110,95,.16),0 18px 34px rgba(50,90,75,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
  font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;color:inherit;padding:0}

.screen{position:fixed;inset:0;display:none;overflow:hidden}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column;
  gap:clamp(18px,4vh,42px);padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}

.round{width:clamp(84px,10vw,110px);height:clamp(84px,10vw,110px);border-radius:50%;
  display:grid;place-items:center;font-size:clamp(40px,5vw,56px);
  background:rgba(255,255,255,.94);box-shadow:0 6px 0 rgba(70,110,95,.18),0 10px 20px rgba(50,90,75,.15);
  transition:transform .12s}
.round:active{transform:scale(.9)}
.topbar{position:absolute;z-index:30;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;
  display:flex;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:auto}

/* ===== ambient blobs (home / select) ===== */
.amb{position:absolute;border-radius:50%;pointer-events:none;
  opacity:calc(.25 * var(--glow) + .08);filter:blur(2px);
  animation:ambFloat calc(9s/var(--spd)) ease-in-out infinite alternate}
@keyframes ambFloat{to{transform:translateY(-7vh) translateX(3vw) scale(1.15)}}

/* ===== titles & labels ===== */
.appTitle{z-index:2;display:flex;align-items:center;gap:clamp(10px,2vw,24px);
  font-size:clamp(44px,7.5vw,92px);font-weight:800;color:#3E8A77;letter-spacing:.05em;
  text-shadow:0 3px 0 #fff,0 10px 16px rgba(70,110,95,.22)}
.appTitle .tch{display:inline-block;animation:tbounce 2.6s ease-in-out infinite}
@keyframes tbounce{50%{transform:translateY(calc(-9px * var(--glow) - 2px)) rotate(2deg)}}
.appTitle .deco{font-size:.8em;filter:drop-shadow(0 4px 3px rgba(40,70,60,.25))}
.screenTitle{z-index:2;font-size:clamp(28px,4.4vw,50px);font-weight:800;color:#3E8A77;
  letter-spacing:.05em;text-shadow:0 3px 0 #fff,0 8px 12px rgba(70,110,95,.18)}
.cardName{position:absolute;left:0;right:0;bottom:clamp(8px,1.4vw,16px);z-index:3;
  text-align:center;font-weight:800;font-size:clamp(19px,2.6vw,30px);color:#456B5B;
  text-shadow:0 2px 0 rgba(255,255,255,.9),0 -1px 0 rgba(255,255,255,.9);pointer-events:none}

/* ===== home ===== */
#start,#character{background:linear-gradient(170deg,#FFF3D6 0%,#DFF3E3 60%,#CBEDDC 100%)}
#start .sunbg,#character .sunbg{position:absolute;top:-20vmin;left:50%;transform:translateX(-50%);
  width:76vmin;height:76vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,107,calc(.5*var(--glow)+.15)),rgba(255,214,107,0) 70%)}
.startIcon{z-index:2;width:clamp(170px,24vw,260px);height:clamp(170px,24vw,260px);object-fit:cover;border-radius:30%;
  box-shadow:0 12px 0 rgba(66,112,93,.16),0 22px 40px rgba(49,96,80,.22);animation:startFloat 2.8s ease-in-out infinite alternate}
@keyframes startFloat{to{transform:translateY(-8px) rotate(2deg) scale(1.02)}}
.startButton{z-index:2;min-width:clamp(220px,32vw,360px);min-height:clamp(88px,11vw,120px);padding:0 32px;border-radius:999px;
  background:linear-gradient(145deg,#FF9B70,#F16F65);color:#fff;font-size:clamp(32px,4.8vw,58px);font-weight:800;
  letter-spacing:.08em;box-shadow:0 10px 0 rgba(147,75,68,.22),0 18px 30px rgba(120,70,60,.2);text-shadow:0 3px 0 rgba(150,70,60,.24)}
.startButton:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(147,75,68,.22)}
#character .topbar{z-index:30}
.cardRow{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3vw,38px);z-index:2}
.bigCardBtn{position:relative;border-radius:34px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow);transition:transform .15s}
.bigCardBtn:active{transform:scale(.94)}
.bigCardBtn svg.bg{position:absolute;inset:0;width:100%;height:100%}
.bigCardBtn .face{position:absolute;inset:0;display:grid;place-items:center;
  filter:drop-shadow(0 6px 4px rgba(40,70,60,.25));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(-12px * var(--glow) - 3px))}}
.themeCard{width:clamp(176px,23vw,272px);height:clamp(208px,27vw,322px)}
.themeCard .face{font-size:clamp(74px,11vw,128px);padding-bottom:14%}
.cardRow>*:nth-child(2) .face{animation-delay:.5s}
.cardRow>*:nth-child(3) .face{animation-delay:1s}

/* ===== game select ===== */
#games{background:linear-gradient(170deg,#FFF3D6,#D5EFF7)}
#games.screen.on{display:block;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;padding:max(104px,calc(env(safe-area-inset-top) + 94px)) 12px max(34px,env(safe-area-inset-bottom))}
#games .topbar{position:fixed}
#games>.screenTitle{position:relative;text-align:center;margin:0 0 clamp(14px,2vh,24px)}
#gameCategories{position:relative;z-index:2;width:min(1080px,96vw);margin:0 auto;
  display:grid;gap:clamp(16px,2.5vh,28px)}
.gameCategory{border-radius:30px;padding:clamp(14px,2vw,24px);
  background:rgba(255,255,255,.66);box-shadow:0 8px 22px rgba(50,90,75,.12)}
.gameCategory:nth-child(2){background:rgba(255,250,220,.72)}
.gameCategory:nth-child(3){background:rgba(238,231,255,.72)}
.categoryTitle{text-align:center;font-size:clamp(25px,3.5vw,38px);font-weight:800;
  color:#3E8A77;margin:0 0 clamp(12px,1.8vh,20px);text-shadow:0 2px 0 #fff}
.gameCategory .cardRow{gap:clamp(12px,2vw,22px)}
.gameCard{width:clamp(150px,18vw,210px);height:clamp(150px,18vw,210px)}
.gameCard .face{font-size:clamp(70px,10vw,120px);padding-bottom:16%}

/* ===== synth music ===== */
#music{background:linear-gradient(165deg,#E8F7FD 0%,#F8E8FF 50%,#FFF3D6 100%);
  gap:clamp(12px,2.4vh,24px);padding-top:max(96px,calc(env(safe-area-inset-top) + 86px))}
#synthPanel{z-index:2;width:min(760px,94vw);display:flex;flex-direction:column;
  align-items:center;gap:clamp(12px,2vh,20px)}
.synthControls{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2vw,18px)}
.synthChoice,.synthAction{width:clamp(82px,10vw,104px);height:clamp(82px,10vw,104px);
  border-radius:28px;background:rgba(255,255,255,.94);font-size:clamp(38px,5vw,52px);
  box-shadow:0 7px 0 rgba(70,90,120,.17),0 13px 24px rgba(70,90,120,.16);
  transition:transform .12s,background .2s,box-shadow .2s}
.synthChoice:active,.synthAction:active,.synthChoice.active{transform:translateY(5px);
  box-shadow:0 2px 0 rgba(70,90,120,.17),0 8px 16px rgba(70,90,120,.14)}
.synthChoice.active{background:#D8F5E8;outline:5px solid rgba(62,138,119,.32)}
.synthAction{background:linear-gradient(145deg,#FF9B70,#F16F65);color:#fff}
.synthAction.playing{background:linear-gradient(145deg,#6B9FD8,#5278B8)}
.pianoWrap{width:min(900px,96vw);padding:clamp(12px,2vw,20px);
  border-radius:32px;background:linear-gradient(155deg,#727A9A,#4C536F);
  box-shadow:0 10px 0 rgba(45,53,78,.3),0 20px 35px rgba(45,53,78,.22)}
.pianoKeyboard{position:relative;width:100%;height:clamp(230px,36vh,330px);
  display:grid;grid-template-columns:repeat(8,1fr);gap:3px;
  border-radius:12px 12px 22px 22px;overflow:visible}
.pianoKey{position:relative;touch-action:none;transition:transform .08s,background .1s,box-shadow .1s}
.whiteKey{z-index:1;min-width:0;border-radius:7px 7px 18px 18px;
  background:linear-gradient(100deg,#F3F3F6 0%,#FFFFFF 42%,#E3E6ED 100%);
  box-shadow:inset 0 -9px 0 #CED2DC,0 5px 8px rgba(25,30,50,.27)}
.whiteKey::after{content:"";position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  width:clamp(16px,2.8vw,25px);height:clamp(16px,2.8vw,25px);border-radius:50%;
  background:#B8E6D2;opacity:.72}
.whiteKey:active,.whiteKey.is-on{transform:translateY(7px);
  background:linear-gradient(100deg,#FFF0B8,#FFF9DD 48%,#F1D98D);
  box-shadow:inset 0 -3px 0 #D8C27B,0 2px 4px rgba(25,30,50,.2)}
.whiteKey:active::after,.whiteKey.is-on::after{background:#FF9B70;opacity:1}
.blackKey{position:absolute;z-index:3;left:var(--x);top:0;transform:translateX(-50%);
  width:8.4%;height:61%;min-height:120px;border-radius:0 0 13px 13px;
  background:linear-gradient(100deg,#25283A,#50556F 55%,#202334);
  box-shadow:inset 0 -8px 0 #171927,0 8px 10px rgba(25,30,50,.4)}
.blackKey:active,.blackKey.is-on{transform:translateX(-50%) translateY(6px);
  background:linear-gradient(100deg,#4D597F,#778AB9 55%,#35405F);
  box-shadow:inset 0 -3px 0 #27314B,0 3px 5px rgba(25,30,50,.3)}
#musicPulse{height:30px;display:flex;align-items:flex-end;justify-content:center;gap:8px}
#musicPulse span{width:11px;height:8px;border-radius:999px;background:#6B9FD8;opacity:.45;
  transition:height .12s,opacity .12s}
#musicPulse.on span{animation:synthMeter calc(.7s/var(--spd)) ease-in-out infinite alternate}
#musicPulse.on span:nth-child(2),#musicPulse.on span:nth-child(5){animation-delay:.12s}
#musicPulse.on span:nth-child(3),#musicPulse.on span:nth-child(6){animation-delay:.24s}
@keyframes synthMeter{to{height:28px;opacity:1}}

/* ===== drawing book ===== */
#drawing{background:linear-gradient(165deg,#FFF3D6,#DFF3E6);padding:0}
#drawShell{position:absolute;z-index:2;top:max(104px,calc(env(safe-area-inset-top) + 94px));
  left:clamp(10px,2vw,24px);right:clamp(10px,2vw,24px);
  bottom:max(12px,env(safe-area-inset-bottom));display:grid;
  grid-template-rows:auto minmax(120px,1fr) auto;gap:clamp(8px,1.5vh,14px)}
#drawPalette{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));
  gap:clamp(5px,.8vw,9px);padding:clamp(8px,1.2vw,12px);
  border-radius:24px;background:rgba(255,255,255,.82);
  box-shadow:0 7px 18px rgba(50,90,75,.14)}
.colorDot{width:100%;min-width:42px;height:clamp(42px,6vw,58px);border-radius:16px;
  background:var(--c);border:3px solid rgba(44,93,85,.12);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.1);transition:transform .1s,outline .1s}
.colorDot.active{transform:translateY(-3px);outline:5px solid rgba(44,93,85,.48);
  outline-offset:1px}
#drawPaper{position:relative;min-height:0;border:clamp(7px,1.2vw,12px) solid #fff;
  border-radius:28px;overflow:hidden;background:#fff;
  box-shadow:0 10px 0 rgba(70,110,95,.14),0 18px 34px rgba(50,90,75,.18)}
#drawCanvas{display:block;width:100%;height:100%;background:#fff;touch-action:none}
#drawTools{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,26px)}
.brushSizes{display:flex;gap:6px;padding:6px;border-radius:22px;background:rgba(255,255,255,.82);
  box-shadow:0 6px 0 rgba(70,110,95,.12),0 10px 18px rgba(50,90,75,.1)}
.brushSize{width:clamp(48px,7vw,62px);height:clamp(56px,8vw,70px);border-radius:17px;
  display:grid;place-items:center;background:#fff;transition:transform .1s,background .15s}
.brushSize span{display:block;width:var(--dot);height:var(--dot);border-radius:50%;background:#315F57}
.brushSize:active,.brushSize.active{transform:translateY(3px);background:#BDE9D1;
  box-shadow:inset 0 0 0 3px rgba(44,93,85,.25)}
.drawTool{width:clamp(68px,9vw,88px);height:clamp(68px,9vw,88px);border-radius:24px;
  display:grid;place-items:center;font-size:clamp(34px,5vw,46px);background:#fff;
  box-shadow:0 6px 0 rgba(70,110,95,.17),0 10px 20px rgba(50,90,75,.13);
  transition:transform .1s,background .15s}
.drawTool:active,.drawTool.active{transform:translateY(5px);background:#D8F5E8}
#clearDrawing.armed{background:#FFE39B;animation:clearWarn .55s ease-in-out infinite alternate}
@keyframes clearWarn{to{transform:scale(1.08)}}

/* ===== drums ===== */
#drums{background:
  radial-gradient(circle at 18% 8%,rgba(61,198,255,.24),transparent 30%),
  radial-gradient(circle at 84% 12%,rgba(255,77,129,.22),transparent 32%),
  linear-gradient(165deg,#0B1328 0%,#182449 55%,#271A39 100%)}
#drumStage{position:absolute;z-index:2;top:max(100px,calc(env(safe-area-inset-top) + 90px));
  left:clamp(10px,2vw,24px);right:clamp(10px,2vw,24px);bottom:max(10px,env(safe-area-inset-bottom));
  border-radius:36px;background:
  linear-gradient(to bottom,transparent 0 68%,rgba(255,255,255,.12) 68% 69%,rgba(13,17,29,.76) 69%),
  radial-gradient(ellipse at 18% 5%,rgba(64,199,255,.25),transparent 42%),
  radial-gradient(ellipse at 82% 5%,rgba(255,73,126,.22),transparent 42%),
  radial-gradient(circle at 50% 44%,rgba(91,102,152,.38),rgba(17,23,48,.52) 62%,rgba(8,12,26,.78) 63%);
  border:2px solid rgba(196,219,255,.24);box-shadow:inset 0 0 60px rgba(0,0,0,.42),0 18px 45px rgba(0,0,0,.34);
  overflow:hidden}
#drumStage::before{content:"";position:absolute;z-index:0;left:8%;right:8%;top:0;height:18px;
  border-radius:0 0 12px 12px;background:linear-gradient(90deg,#38425D,#B8C4D5 18%,#48536D 36%,#C4CFDD 52%,#48536D 68%,#B8C4D5 84%,#38425D);
  box-shadow:0 5px 12px rgba(0,0,0,.42)}
#drumStage::after{content:"";position:absolute;z-index:0;left:10%;right:10%;bottom:2%;height:8%;
  border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.16),transparent 70%);filter:blur(5px)}
#drumHardware{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.48)) brightness(1.25)}
.drumPad{position:absolute;display:grid;place-items:center;touch-action:manipulation;
  z-index:2;filter:drop-shadow(0 12px 8px rgba(0,0,0,.58));transition:transform .07s,filter .1s}
.drumPad::before{content:"";position:absolute;inset:8%;border-radius:inherit;
  border:clamp(4px,.7vw,7px) solid rgba(255,255,255,.7);box-shadow:inset 0 0 0 4px rgba(50,55,85,.1)}
.drumPad::after{content:"";width:28%;height:28%;border-radius:50%;
  background:rgba(255,255,255,.35);transform:translate(-34%,-34%)}
.drumPad:active,.drumPad.hit{transform:scale(.95);
  filter:drop-shadow(0 0 calc(10px + 20px * var(--glow)) rgba(67,206,255,.76)) brightness(1.18)}
.drumPad.hit::after{animation:drumFlash .22s ease-out}
@keyframes drumFlash{from{transform:scale(.3);opacity:1}to{transform:scale(2.5);opacity:0}}
.cymbal{width:clamp(100px,20vw,180px);height:clamp(76px,12vw,110px);border-radius:50%;
  border:3px solid #79500B;background:repeating-radial-gradient(ellipse at center,#FFF7B8 0 4%,#E5B938 5% 9%,#FFE883 10% 14%,#BB7713 15% 19%);
  box-shadow:inset 0 -7px 12px rgba(90,45,0,.28),0 3px 0 #6E470A}
.cymbal::before{inset:27% 39%;border:3px solid #B47A17;
  background:radial-gradient(ellipse at 38% 30%,#FFF6B8,#D89B25 75%);box-shadow:0 3px 3px rgba(80,50,15,.25)}
.cymbal::after{width:18%;height:22%;background:rgba(255,255,255,.55)}
.drumRound{width:clamp(96px,18vw,164px);aspect-ratio:1;border-radius:50%;
  border:3px solid #170D0F;background:
  linear-gradient(110deg,transparent 15%,rgba(255,255,255,.35) 22%,transparent 31%),
  radial-gradient(circle,#F8F4EA 0 62%,#D22435 63% 67%,#710F1B 68% 77%,#24090D 78%);
  box-shadow:inset 0 -9px 0 rgba(20,3,6,.62),0 5px 0 #120D10}
.drumRound::before{inset:9%;border:clamp(4px,.7vw,7px) solid #C7CDD1;
  background:radial-gradient(circle at 42% 34%,#FFFFFF,#E9E7DF 72%,#C8C7C0);
  box-shadow:0 0 0 3px #596169,inset 0 0 14px rgba(70,75,80,.14)}
.drumRound::after{width:18%;height:18%;background:rgba(255,255,255,.64)}
#drumHihat{left:2%;top:5%}
#drumCrash{right:2%;top:4%;transform:rotate(-4deg)}
#drumCrash:active,#drumCrash.hit{transform:rotate(-4deg) scale(.94)}
#drumTom1{left:25%;top:20%}
#drumTom2{right:25%;top:20%}
#drumSnare{left:5%;top:48%;border-color:#48515A;
  background:linear-gradient(110deg,transparent 16%,rgba(255,255,255,.65) 24%,transparent 34%),
  radial-gradient(circle,#F8F7F0 0 62%,#D5DEE5 63% 68%,#65717D 69% 77%,#27303A 78%)}
#drumFloor{right:5%;top:49%}
#drumKick{left:50%;bottom:3%;transform:translateX(-50%);width:clamp(154px,29vw,258px);
  aspect-ratio:1;border-radius:50%;z-index:3;border:5px solid #321A18;
  background:linear-gradient(110deg,transparent 16%,rgba(255,255,255,.36) 23%,transparent 32%),
  radial-gradient(circle,#F8F6EC 0 61%,#D12434 62% 67%,#710F1B 68% 76%,#24090D 77%);
  box-shadow:inset 0 -12px 0 rgba(38,10,9,.5),0 9px 0 #291D1B}
#drumKick::before{inset:8%;border:clamp(5px,.8vw,9px) solid #AEB4B8;
  background:radial-gradient(circle at 45% 38%,#FFFFFF,#E6E3D9 75%,#C7C3B8);
  box-shadow:0 0 0 4px #51575C,inset 0 0 20px rgba(60,60,60,.12)}
#drumKick:active,#drumKick.hit{transform:translateX(-50%) scale(.96)}
#drumKick::after{width:22%;height:22%;background:#252525;transform:none;
  box-shadow:0 0 0 7px rgba(255,255,255,.82)}
.kickMark{position:relative;z-index:4;color:#D12434;font-size:clamp(34px,7vw,64px);
  line-height:1;text-shadow:0 2px 0 #fff,0 0 16px rgba(209,36,52,.3);pointer-events:none}
@media (max-width:520px){
  .cymbal{width:104px;height:72px}
  .drumRound{width:98px}
  #drumTom1{left:23%;top:19%}
  #drumTom2{right:23%;top:19%}
  #drumSnare{left:2%;top:48%}
  #drumFloor{right:2%;top:49%}
  #drumKick{width:162px;bottom:4%}
}

/* ===== play ===== */
#play{background:#BEE7F5}
#scene{position:absolute;inset:0}
#scene svg{width:100%;height:100%;display:block}
#stage{position:absolute;inset:0;z-index:5;overflow:hidden}
.item{position:absolute;left:0;top:0;width:var(--sz,120px);height:var(--sz,120px);
  display:grid;place-items:center;font-size:calc(var(--sz,120px)*.72);
  filter:drop-shadow(0 8px 6px rgba(30,70,90,.22));will-change:transform}
.item .hit{position:absolute;inset:-24%;border-radius:50%}
.pop{position:absolute;left:0;top:0;z-index:12;pointer-events:none;font-size:34px;will-change:transform,opacity}
/* 風船+ぶらさがりキャラ */
.item.bItem{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  height:calc(var(--sz,120px)*1.5);gap:0}
.bItem .bal{font-size:calc(var(--sz,120px)*.68);line-height:1}
.bItem .bstr{width:3px;height:calc(var(--sz,120px)*.14);background:#9A7B4F;border-radius:2px}
.bItem .bchr2{font-size:calc(var(--sz,120px)*.48);line-height:1}
/* シャボン玉の中のキャラ */
.bwrap{position:relative;display:grid;place-items:center}
.bwrap .bchr{font-size:calc(var(--sz,120px)*.46);line-height:1}
.bwrap .bbl{position:absolute;font-size:calc(var(--sz,120px)*.95);opacity:.85;line-height:1}
#basket{position:absolute;z-index:8;bottom:2vh;width:clamp(150px,20vw,230px);
  pointer-events:none;filter:drop-shadow(0 10px 8px rgba(40,70,60,.3));will-change:transform}
/* カゴの中にたまっていくもの。下からひょいと現れる */
/* 拡大縮小は原点の扱いがSafariで揺れるので、上下移動と透明度だけで動かす */
#bkItems text{animation:bkIn .34s cubic-bezier(.25,1.4,.5,1)}
@keyframes bkIn{0%{transform:translateY(17px);opacity:0}55%{opacity:1}100%{transform:translateY(0);opacity:1}}
/* カゴに入った瞬間のはずみ。かごの口を軸に少しつぶれる */
#basket svg{transform-origin:50% 10%}
#basket svg.catchPop{animation:bkCatch .3s ease-out}
@keyframes bkCatch{0%{transform:scale(1,1)}30%{transform:scale(1.07,.93)}62%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
#stars{position:absolute;z-index:25;top:max(20px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;
  gap:2px clamp(3px,.6vw,8px);
  padding:8px 16px;border-radius:26px;background:rgba(255,255,255,.55);
  backdrop-filter:blur(3px);filter:drop-shadow(0 3px 3px rgba(40,70,60,.2));
  pointer-events:none}
.star{filter:grayscale(1);opacity:.3;transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.star.onn{filter:none;opacity:1;transform:scale(1.18)}
#bigGift{position:absolute;z-index:40;left:50%;top:42%;font-size:clamp(120px,22vw,220px);
  display:none;filter:drop-shadow(0 16px 14px rgba(120,70,20,.35));will-change:transform}
#bigGift.show{display:block;animation:giftDrop calc(.9s/var(--spd)) cubic-bezier(.3,1.5,.4,1) both,
  giftPulse 1.7s calc(1s/var(--spd)) ease-in-out infinite}
@keyframes giftDrop{from{transform:translate(-50%,-90vh) rotate(-24deg)}to{transform:translate(-50%,-50%)}}
@keyframes giftPulse{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-50%) scale(calc(1 + .12*var(--glow)))}}

/* ---- race game ---- */
#car{position:absolute;z-index:8;bottom:7vh;width:clamp(120px,14vw,180px);pointer-events:none;transform-origin:50% 92%;
  filter:drop-shadow(0 5px 5px rgba(30,60,80,.4));will-change:transform,left}
#car svg{width:100%;height:auto;display:block}
.roadLine{position:absolute;top:0;bottom:0;width:9px;transform:translateX(-50%);z-index:4;opacity:.95;
  background:repeating-linear-gradient(180deg,#FFF6DE 0 46px,transparent 46px 112px);
  animation:roadMove calc(.5s/var(--spd)) linear infinite}
@keyframes roadMove{to{background-position:0 112px}}

/* ---- pinball game ---- */
.pinballCanvas{position:absolute;inset:0;z-index:5;width:100%;height:100%;touch-action:none}
.pinControls{position:absolute;inset:0;z-index:18;pointer-events:none}
.pinControl{position:absolute;pointer-events:auto;width:clamp(84px,12vw,112px);height:clamp(84px,12vw,112px);
  bottom:max(14px,env(safe-area-inset-bottom));border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:clamp(34px,5vw,48px);font-weight:900;
  background:linear-gradient(145deg,rgba(37,72,118,.92),rgba(17,37,72,.96));
  border:4px solid rgba(133,222,255,.85);box-shadow:0 7px 0 rgba(6,21,48,.55),0 12px 24px rgba(4,16,40,.34);
  text-shadow:0 2px 0 rgba(0,0,0,.35);touch-action:none;transition:transform .08s,filter .15s}
.pinControl:active,.pinControl.pressed{transform:translateY(5px) scale(.96);filter:brightness(1.25)}
.pinLeft{left:max(14px,env(safe-area-inset-left))}
.pinRight{right:max(14px,env(safe-area-inset-right))}
.pinLaunch{right:max(18px,calc(env(safe-area-inset-right) + 4px));
  bottom:max(112px,calc(env(safe-area-inset-bottom) + 108px));
  background:linear-gradient(145deg,#F5B83D,#E86D45);border-color:#FFF1A6}
.pinLaunch.ready{animation:pinReady calc(1.1s/var(--spd)) ease-in-out infinite}
@keyframes pinReady{50%{transform:translateY(-7px);filter:brightness(1.25);
  box-shadow:0 8px 0 rgba(95,45,20,.45),0 0 calc(12px + 12px * var(--glow)) rgba(255,222,92,.9)}}
@media (max-height:540px){
  .pinControl{width:80px;height:80px;font-size:32px;bottom:max(9px,env(safe-area-inset-bottom))}
  .pinLaunch{right:max(102px,calc(env(safe-area-inset-right) + 96px));bottom:max(9px,env(safe-area-inset-bottom))}
}

/* ---- match game ---- */
.mboard{position:absolute;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  filter:drop-shadow(0 14px 18px rgba(60,35,10,.35))}
.mboard svg{width:100%;height:100%;display:block}
.slot{position:absolute;width:var(--ss,140px);height:var(--ss,140px);transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.slot svg{width:100%;height:100%}
.piece{position:absolute;width:var(--ss,140px);height:var(--ss,140px);transform:translate(-50%,-50%);
  z-index:8;background:none;touch-action:none;
  transition:left calc(.35s/var(--spd)) cubic-bezier(.3,1.3,.5,1),top calc(.35s/var(--spd)) cubic-bezier(.3,1.3,.5,1);
  filter:drop-shadow(0 8px 6px rgba(30,70,90,.25))}
.piece.drag{transition:none;z-index:22;filter:drop-shadow(0 18px 14px rgba(30,70,90,.32))}
.piece.placed{pointer-events:none}
.piece svg{width:100%;height:100%;pointer-events:none}

/* ---- card fitting game ---- */
.cardFitBoard{position:absolute;z-index:7;left:50%;top:55%;transform:translate(-50%,-50%);
  width:min(720px,94vw,calc(148vh - 178px));width:min(720px,94vw,calc(148dvh - 178px));
  padding:clamp(8px,1.6vw,16px);border-radius:30px;
  background:rgba(255,250,235,.78);box-shadow:0 14px 34px rgba(55,70,80,.22)}
.cardFitRow{display:grid;grid-template-columns:repeat(var(--card-count,4),minmax(0,1fr));
  gap:clamp(7px,1.5vw,14px)}
.cardFitGuide{height:clamp(24px,4.2vh,38px);display:grid;place-items:center;
  color:#3E8A77;font-size:clamp(25px,4.2vh,38px);line-height:1;
  filter:drop-shadow(0 3px 2px rgba(40,80,70,.2));pointer-events:none}
.cardFitSlot,.cardFitHome{position:relative;min-width:0;aspect-ratio:5/7;border-radius:clamp(10px,1.7vw,18px)}
.cardFitSlot{padding:4px;border:4px dashed rgba(62,138,119,.48);
  background:rgba(207,235,217,.58);touch-action:manipulation}
.cardFitHome{background:rgba(255,255,255,.32);box-shadow:inset 0 0 0 2px rgba(70,110,95,.1)}
.playingCard{position:absolute;inset:0;border-radius:clamp(9px,1.5vw,16px);
  background:linear-gradient(145deg,#FFFFFF,#F7F4ED);border:clamp(3px,.55vw,6px) solid #fff;
  box-shadow:inset 0 0 0 2px #D8D1C6,0 6px 10px rgba(35,50,65,.2);
  font-family:Georgia,"Times New Roman",serif;color:#273548}
.playingCard.red{color:#D8323C}
.cardFitSlot>.cardFitPreview{inset:4px;opacity:.75;box-shadow:inset 0 0 0 2px #D8D1C6}
.cardFitSlot.filled{border-color:rgba(255,190,35,.9);
  filter:drop-shadow(0 0 calc(7px + 8px*var(--glow)) rgba(255,203,60,.85))}
.cardFitSlot.filled>.cardFitPreview{opacity:.15}
.cardFitPiece{width:auto;height:auto;z-index:9;touch-action:none;
  transition:transform calc(.35s/var(--spd)) cubic-bezier(.3,1.3,.5,1),filter .18s}
.cardFitPiece.drag{z-index:30;transition:none;filter:drop-shadow(0 16px 12px rgba(30,55,75,.36))}
.cardFitPiece.selected{filter:drop-shadow(0 0 10px rgba(62,138,119,.95))}
.cardFitPiece.placed{inset:4px;pointer-events:none}
.cardCorner{position:absolute;left:9%;top:5%;display:flex;flex-direction:column;align-items:center;
  font-size:clamp(16px,3.3vw,34px);font-weight:700;line-height:.82}
.cardCorner span{font-size:.68em;margin-top:.14em}
.cardCorner.bottom{left:auto;top:auto;right:9%;bottom:5%;transform:rotate(180deg)}
.cardCenter{position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(32px,7.6vw,76px);line-height:1}
.cardFitSlot:focus-visible,.cardFitPiece:focus-visible{outline:5px solid #3E8A77;outline-offset:3px}
@media (max-height:540px){
  .cardFitBoard{top:58%;padding:7px}
  .cardFitGuide{height:22px;font-size:23px}
}

/* ---- mole holes ---- */
.hole{position:absolute;width:clamp(120px,15vw,190px);transform:translate(-50%,-50%);z-index:6}
.hole svg{display:block;width:100%;overflow:visible}
.hole .back{position:relative;z-index:1}
.hole .cwrap{position:absolute;left:-6%;right:-6%;bottom:30%;height:230%;
  overflow:hidden;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.hole .char{font-size:clamp(70px,9.5vw,112px);line-height:1;padding:14px 22px;
  filter:drop-shadow(0 6px 5px rgba(40,70,60,.3));
  transform:translateY(115%);transition:transform calc(.3s/var(--spd)) cubic-bezier(.3,1.5,.5,1)}
.hole.up .char{transform:translateY(-2%)}
.hole.happy .char{animation:happyJump calc(.5s/var(--spd)) ease-out}
@keyframes happyJump{30%{transform:translateY(-30%) scale(1.15)}100%{transform:translateY(115%)}}
.hole .mound{position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none}

/* ===== reward / gacha ===== */
#reward{background:linear-gradient(170deg,#FFEFD0,#FBD9D2)}
#machineWrap{position:relative;width:clamp(310px,44vw,500px)}
#machineWrap svg.machine{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 22px rgba(120,60,40,.25))}
#machineBtn{position:absolute;inset:0;z-index:2}
#machineBtn:active{transform:scale(.97)}
#knob{transform-box:fill-box;transform-origin:center}
#knob.turn{animation:knobSpin calc(.95s/var(--spd)) cubic-bezier(.5,.05,.3,1)}
@keyframes knobSpin{to{transform:rotate(360deg)}}
#capsule{position:absolute;left:50%;bottom:5%;width:31%;z-index:5;background:none;
  transform:translateX(-50%) scale(0)}
#capsule svg{display:block;width:100%;overflow:visible}
#capsule svg g{transform-box:fill-box;transform-origin:center;transition:transform calc(.4s/var(--spd)),opacity calc(.4s/var(--spd))}
#capsule.drop{animation:capDrop calc(.75s/var(--spd)) cubic-bezier(.34,1.55,.5,1) both}
@keyframes capDrop{0%{transform:translateX(-50%) translateY(-320%) scale(.55)}
  62%{transform:translateX(-50%) translateY(10%) scale(1.12,.82)}
  82%{transform:translateX(-50%) translateY(-6%) scale(.94,1.08)}
  100%{transform:translateX(-50%) scale(1)}}
#capsule.wob{animation:wob .55s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-50%) rotate(-10deg)}75%{transform:translateX(-50%) rotate(10deg)}}
#capsule.zoom{animation:none;z-index:9;
  transform:translateX(-50%) translateY(-125%) scale(2.4);
  transition:transform calc(.55s/var(--spd)) cubic-bezier(.3,1.25,.4,1)}
#capsule.open{animation:none}
#capsule.open .capTop{transform:translate(-16px,-60px) rotate(-32deg);opacity:0}
#capsule.open .capBottom{transform:translate(16px,36px) rotate(26deg);opacity:0}
#hand{position:absolute;z-index:6;font-size:clamp(46px,7vw,74px);pointer-events:none;display:none;
  filter:drop-shadow(0 6px 5px rgba(40,40,40,.35));animation:handBob .85s ease-in-out infinite}
#hand.show{display:block}
@keyframes handBob{50%{transform:translateY(-16px)}}
#flyCoin{position:absolute;z-index:5;left:50%;top:-16vh;font-size:clamp(60px,9vw,90px);
  transform:translateX(-50%);filter:drop-shadow(0 8px 6px rgba(150,95,0,.3));display:none}
#flyCoin.go{display:block;animation:coinFly calc(1s/var(--spd)) cubic-bezier(.4,0,.6,1.2) forwards}
@keyframes coinFly{to{top:34%;transform:translateX(-50%) rotate(360deg) scale(.55);opacity:0}}
#cardBox{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:4vh;background:radial-gradient(circle,rgba(255,252,240,.96),rgba(255,238,214,.98))}
#cardBox.on{display:flex}
#bigCard{width:clamp(220px,30vw,320px);aspect-ratio:3/4;border-radius:30px;border:12px solid #fff;
  display:grid;place-items:center;font-size:clamp(120px,18vw,190px);
  background:linear-gradient(150deg,#FFF6C9,#CDEFFB);
  box-shadow:0 0 0 6px rgba(255,201,77,.5),0 24px 50px rgba(120,80,30,.3);
  animation:reveal calc(.8s/var(--spd)) cubic-bezier(.2,1,.3,1.25) both}
@keyframes reveal{from{transform:rotateY(90deg) scale(.3);opacity:0}}
#againRow{display:flex;gap:5vw}

/* ===== book ===== */
#book{background:linear-gradient(170deg,#FFF3D6,#E7E9F6)}
#bookGrid{width:min(940px,92vw);max-height:70vh;overflow-y:auto;display:grid;
  grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,22px);padding:10px 10px 100px;
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.bookCard{aspect-ratio:3/4;border-radius:22px;display:grid;place-items:center;
  font-size:clamp(50px,7vw,84px);background:#fff;box-shadow:var(--shadow)}
.bookCard.locked{background:rgba(255,255,255,.4);box-shadow:none}
.bookCard.locked span{filter:grayscale(1) brightness(2.6) contrast(.15)}

/* ===== hero ===== */
#heroHome{position:absolute;left:5%;bottom:8%;width:clamp(110px,15vw,190px);z-index:2;
  filter:drop-shadow(0 10px 8px rgba(40,70,60,.25));transform-origin:50% 88%;
  animation:heroTrick calc(4.8s/var(--spd)) ease-in-out infinite}
@keyframes heroTrick{
  0%{transform:translateY(0) rotate(0)}
  6%{transform:translateY(-12px) rotate(0)}
  11%{transform:translateY(0) scale(1.06,.93)}
  16%{transform:translateY(-12px) scale(1)}
  21%{transform:translateY(0) scale(1.06,.93)}
  26%{transform:translateY(0) scale(1)}
  38%{transform:translateY(-72px) rotate(200deg)}
  50%{transform:translateY(0) rotate(360deg)}
  54%{transform:translateY(0) rotate(360deg) scale(1.16,.82)}
  60%{transform:translateY(-6px) rotate(360deg) scale(.95,1.06)}
  65%{transform:translateY(0) rotate(360deg) scale(1)}
  74%{transform:rotate(354deg)}
  82%{transform:rotate(366deg)}
  90%,100%{transform:rotate(360deg)}}
#heroHome svg{width:100%;height:auto;display:block}
#heroFly{position:absolute;z-index:38;left:0;top:24%;width:clamp(170px,24vw,280px);
  display:none;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(40,70,60,.3))}
#heroFly svg{width:100%;height:auto;display:block}
#heroFly.go{display:block;animation:heroDash calc(1.7s/var(--spd)) ease-in-out forwards}
@keyframes heroDash{
  0%{transform:translateX(-32vw) translateY(7vh) rotate(4deg)}
  50%{transform:translateX(38vw) translateY(-3vh) rotate(-4deg)}
  100%{transform:translateX(115vw) translateY(5vh) rotate(4deg)}}

/* ===== staff ===== */
#gearBtn{position:absolute;z-index:31;top:max(14px,env(safe-area-inset-top));right:16px;
  width:clamp(64px,7.5vw,88px);height:clamp(64px,7.5vw,88px);border-radius:50%;
  display:grid;place-items:center;font-size:clamp(30px,3.6vw,44px);
  background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(70,110,95,.14);opacity:.85}
#gearBtn.holding{animation:gearSpin 2s linear}
@keyframes gearSpin{to{transform:rotate(360deg)}}

#staffHold{position:fixed;z-index:98;left:0;bottom:0;width:88px;height:88px;opacity:0}
#drawing.on~#staffHold{pointer-events:none}
#play.pinballMode.on~#staffHold{left:auto;right:0;top:0;bottom:auto}
#settings{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(25,50,46,.72);padding:20px}
#settings.open{display:flex}
.panel{width:min(660px,94vw);max-height:92vh;overflow-y:auto;background:#fff;border-radius:28px;
  padding:30px;color:var(--ink);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{font-size:26px;margin-bottom:18px}
.setting{margin:18px 0}
.setting p{font-size:20px;font-weight:700;margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.levels.three{grid-template-columns:repeat(3,1fr)}
.levels.two{grid-template-columns:repeat(2,1fr)}
.level{min-height:76px;border-radius:16px;background:#EAF2EF;font-size:19px;font-weight:700}
.level.active{background:#3E8A77;color:#fff}
.closeSettings{width:100%;min-height:80px;margin-top:18px;border-radius:16px;
  background:#24504B;color:#fff;font-size:22px}
.clearBookBtn{position:absolute;z-index:24;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
  min-width:clamp(150px,20vw,210px);min-height:76px;padding:10px 18px;border-radius:18px;
  background:#EAF2EF;color:#315F57;font-size:19px;font-weight:800;transition:transform .12s,background .2s,color .2s}
.clearBookBtn:active{transform:scale(.97)}
.clearBookBtn.armed{background:#C85F55;color:#fff}
@media (max-width:760px){
  #start .appTitle{width:100%;max-width:100%;justify-content:center;gap:8px;
    font-size:clamp(32px,8vw,52px);letter-spacing:.02em;white-space:nowrap}
  #bookGrid{grid-template-columns:repeat(3,1fr)}
  .themeCard{width:146px;height:176px}
  .gameCard{width:146px;height:146px}
  #drawPalette{grid-template-columns:repeat(8,minmax(36px,1fr));gap:5px;padding:7px}
  .colorDot{min-width:36px;height:42px;border-radius:13px}
}
@media (max-width:460px){
  #music{padding-left:8px;padding-right:8px}
  .pianoWrap{width:98vw;padding:10px;border-radius:24px}
  .pianoKeyboard{height:clamp(250px,38vh,310px);gap:2px}
  .whiteKey{border-radius:5px 5px 12px 12px}
  .whiteKey::after{bottom:17px}
  .blackKey{width:9.3%;min-height:125px}
}
@media (max-height:540px){
  #music{justify-content:flex-start;overflow-y:auto;touch-action:pan-y}
  .pianoKeyboard{height:210px}
  .blackKey{min-height:112px}
  #drawShell{top:max(82px,calc(env(safe-area-inset-top) + 74px));gap:6px}
  #drawPalette{grid-template-columns:repeat(12,minmax(30px,1fr));padding:5px;gap:4px}
  .colorDot{min-width:30px;height:34px;border-radius:10px}
  .brushSizes{padding:4px;gap:4px}
  .brushSize{width:42px;height:48px;border-radius:14px}
  .drawTool{width:56px;height:56px;border-radius:18px;font-size:30px}
  #drumStage{top:max(80px,calc(env(safe-area-inset-top) + 70px))}
  .cymbal{width:90px;height:58px}
  .drumRound{width:78px}
  #drumKick{width:122px;bottom:1%}
}
@media (prefers-reduced-motion:reduce){.face,.amb{animation:none}}
</style>
</head>
<body>

<section id="start" class="screen center on" aria-label="スタート">
  <div class="sunbg"></div>
  <div class="amb" style="width:22vmin;height:22vmin;left:8%;top:16%;background:#FFD6C4"></div>
  <div class="amb" style="width:18vmin;height:18vmin;left:78%;top:64%;background:#BDE9C9;animation-delay:1.4s"></div>
  <img class="startIcon" src="icon.png?v=30" alt="あそびのにわ">
  <h1 class="appTitle"><span class="deco">🌸</span><span id="titleTxt">あそびのにわ</span><span class="deco">🎈</span></h1>
  <button id="startBtn" class="startButton" aria-label="スタート">スタート</button>
  <button class="round" id="startBook" aria-label="ずかん">📖</button>
  <button id="gearBtn" aria-label="職員用設定">⚙️</button>
</section>

<section id="character" class="screen center" aria-label="キャラクターをえらぶ">
  <div class="sunbg"></div>
  <div class="topbar"><button class="round" id="backGamesFromCharacter" aria-label="ゲーム選択">↩️</button></div>
  <h2 class="screenTitle">キャラクターをえらぶ</h2>
  <div class="amb" style="width:26vmin;height:26vmin;left:6%;top:64%;background:#FFD6C4"></div>
  <div class="amb" style="width:20vmin;height:20vmin;left:78%;top:18%;background:#BDE9C9;animation-delay:1.4s"></div>
  <div class="amb" style="width:16vmin;height:16vmin;left:70%;top:70%;background:#C9E1FF;animation-delay:2.6s"></div>
  <div class="cardRow">
    <button class="bigCardBtn themeCard theme" data-theme="flower" aria-label="はな">
      <svg class="bg" viewBox="0 0 100 120" preserveAspectRatio="none"><rect width="100" height="120" fill="#FFE9C2"/><circle cx="78" cy="20" r="14" fill="#FFD66B"/><ellipse cx="20" cy="118" rx="70" ry="38" fill="#A8D8A0"/><ellipse cx="92" cy="126" rx="66" ry="34" fill="#8FCB8A"/></svg>
      <span class="face">🌸</span><span class="cardName">はな</span></button>
    <button class="bigCardBtn themeCard theme" data-theme="animal" aria-label="どうぶつ">
      <svg class="bg" viewBox="0 0 100 120" preserveAspectRatio="none"><rect width="100" height="120" fill="#DFF3E6"/><path d="M-5 70 L20 30 L45 70 Z" fill="#7FBF8E"/><path d="M35 78 L65 26 L95 78 Z" fill="#5FA878"/><path d="M70 74 L92 42 L114 74 Z" fill="#7FBF8E"/><rect y="70" width="100" height="50" fill="#9CCF8B"/></svg>

function vroom(pitch=1){
  const vol=VOL[saved.settings.sound]; if(!vol||!AC)return;
  const t=AC.currentTime;
  const o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(62*pitch,t);o.frequency.exponentialRampToValueAtTime(150*pitch,t+.32);
  o2.type='square';o2.frequency.setValueAtTime(124*pitch,t);o2.frequency.exponentialRampToValueAtTime(300*pitch,t+.32);
  f.type='lowpass';f.frequency.setValueAtTime(320,t);f.frequency.linearRampToValueAtTime(760,t+.3);f.Q.value=2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*1.15,t+.05);
  g.gain.exponentialRampToValueAtTime(.001,t+.55);

let bgm={on:false,t:null,step:0,g:null,trk:'title'};
function bgmNote(freq,dur,type,v,delay=0){
  if(!AC||!bgm.g)return;

  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);

  else if(b!==null&&b!==undefined){bgmNote(fq(ch[b]-12),st*T.bdur,'sine',1)}
  const m=T.mel[s];
  if(m!==null&&m!==undefined){

let drumNoiseBuffer=null,drumBus=null,drumBusContext=null;
function getDrumBus(){
  if(!AC)return null;
  if(drumBus&&drumBusContext===AC)return drumBus;
  const input=AC.createGain(),lowCut=AC.createBiquadFilter(),drive=AC.createWaveShaper(),comp=AC.createDynamicsCompressor(),out=AC.createGain();
  const curve=new Float32Array(1024),amount=1.7,normal=Math.tanh(amount);
  for(let i=0;i<curve.length;i++){const x=i*2/(curve.length-1)-1;curve[i]=Math.tanh(amount*x)/normal}
  drive.curve=curve;drive.oversample='2x';
  lowCut.type='highpass';lowCut.frequency.value=40;lowCut.Q.value=.7;
  comp.threshold.value=-16;comp.knee.value=16;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.18;
  out.gain.value=1.15;input.connect(lowCut).connect(drive).connect(comp).connect(out).connect(AC.destination);
  drumBus=input;drumBusContext=AC;return drumBus;
}
function getDrumNoise(){
  if(drumNoiseBuffer||!AC)return drumNoiseBuffer;
  drumNoiseBuffer=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=drumNoiseBuffer.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return drumNoiseBuffer;
}
function drumNoise(dur,freq,type='highpass',v=1){
  const vol=VOL[saved.settings.sound]*v;if(!AC||!vol)return;
  const t=AC.currentTime,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=getDrumNoise();f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=type==='bandpass'?1.2:.7;
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  src.loop=true;src.connect(f).connect(g).connect(getDrumBus()||AC.destination);src.start(t,Math.random()*.25);src.stop(t+dur+.03);
}
function drumOsc(from,to,dur,type='sine',v=1){
  const vol=VOL[saved.settings.sound]*v;if(!AC||!vol)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(to,t+Math.min(.1,dur*.45));
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(getDrumBus()||AC.destination);o.start(t);o.stop(t+dur+.03);
}
function drumTransient(from,to,dur,type='square',v=1){
  const vol=VOL[saved.settings.sound]*v;if(!AC||!vol)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(to,t+dur*.82);
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(vol,t+.0015);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(getDrumBus()||AC.destination);o.start(t);o.stop(t+dur+.02);
}
function drumMetal(freqs,dur,v=1){
  const vol=VOL[saved.settings.sound]*v/Math.sqrt(freqs.length);if(!AC||!vol)return;
  const t=AC.currentTime,g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='highpass';f.frequency.setValueAtTime(700,t);
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  f.connect(g).connect(getDrumBus()||AC.destination);
  freqs.forEach(freq=>{const o=AC.createOscillator();o.type='square';o.frequency.setValueAtTime(freq,t);o.connect(f);o.start(t);o.stop(t+dur+.03)});
}

const DRAW_COLORS=[

const DRAW_WIDTHS=[7,15,28];
let drawWidthIndex=1,drawingHasContent=false,drawingEraser=false,clearDrawingArmed=false,clearDrawingTimer=0;
function initDrawingPalette(){
  const palette=$('#drawPalette');palette.innerHTML='';
  DRAW_COLORS.forEach((color,i)=>{

      $$('.brushSize').forEach(x=>{const on=Number(x.dataset.size)===drawWidthIndex;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});

function resizeDrawingCanvas(){
  const r=drawCanvas.getBoundingClientRect();if(r.width<2||r.height<2)return;
  const old=document.createElement('canvas');
  if(drawingReady&&drawingHasContent){old.width=drawCanvas.width;old.height=drawCanvas.height;old.getContext('2d').drawImage(drawCanvas,0,0)}
  const dpr=Math.min(2,window.devicePixelRatio||1);
  drawCanvas.width=Math.round(r.width*dpr);drawCanvas.height=Math.round(r.height*dpr);
  drawCtx=drawCanvas.getContext('2d');drawCtx.setTransform(dpr,0,0,dpr,0,0);
  drawCtx.lineCap='round';drawCtx.lineJoin='round';
  if(old.width)drawCtx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  drawingReady=true;
}
function drawingPoint(ev){
  const r=drawCanvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top,r};
}
function beginDrawing(ev){
  if(drawingPointer!==null)return;ev.preventDefault();drawingPointer=ev.pointerId;
  drawCanvas.setPointerCapture?.(ev.pointerId);
  const p=drawingPoint(ev);drawCtx||resizeDrawingCanvas();if(!drawCtx)return;
  drawCtx.globalCompositeOperation=drawingEraser?'destination-out':'source-over';
  drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=drawingEraser?36:DRAW_WIDTHS[drawWidthIndex];
  drawCtx.beginPath();drawCtx.moveTo(p.x,p.y);drawCtx.lineTo(p.x+.01,p.y+.01);drawCtx.stroke();
  drawingHasContent=true;
}
function moveDrawing(ev){
  if(ev.pointerId!==drawingPointer||!drawCtx)return;ev.preventDefault();
  const p=drawingPoint(ev);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();
}
function endDrawing(ev){
  if(ev.pointerId!==drawingPointer)return;
  try{drawCanvas.releasePointerCapture?.(ev.pointerId)}catch(e){}
  drawingPointer=null;drawCtx?.closePath();
}
function resetClearDrawing(){
  clearTimeout(clearDrawingTimer);clearDrawingArmed=false;
  const b=$('#clearDrawing');b.classList.remove('armed');b.textContent='🗑️';
}
function clearDrawing(){
  if(!drawCtx)return;
  drawCtx.save();drawCtx.setTransform(1,0,0,1,0,0);
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);drawCtx.restore();
  drawingHasContent=false;resetClearDrawing();ensureAC();sparkleUp();
}

function burst(x,y,icon,n=7,parent=stage){
  n=Math.max(3,Math.round(n*(.4+glow())));
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pop';p.textContent=icon;
    const a=Math.random()*Math.PI*2,d=60+Math.random()*90,s=.5+Math.random()*.8;
    p.style.transform=`translate(${x}px,${y}px) scale(.3)`;p.style.opacity=.4+glow()*.6;
    parent.append(p);
    requestAnimationFrame(()=>{
      p.style.transition=`transform ${.7/spd()}s cubic-bezier(.2,.7,.4,1), opacity ${.7/spd()}s`;
      p.style.transform=`translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d-40}px) scale(${s}) rotate(${(Math.random()*120-60)}deg)`;
      p.style.opacity=0;
    });
    setTimeout(()=>p.remove(),900/spd());
  }
}

/* カゴの中に受け取ったものを積む。手前のふちより奥に描かれるので中に入って見える */
function clearBasketItems(){const g=$('#bkItems');if(g)g.textContent=''}
function putInBasket(chr){
  const g=$('#bkItems');if(!g||!chr)return;
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  const n=g.childElementCount;
  t.setAttribute('x',70+[0,-26,26,-13,13][n%5]);   /* 口(x=18〜122)の中に並べる */
  t.setAttribute('y',25-(n%2)*3);   /* 下半分が手前のふちに隠れて「入っている」ように見える高さ */
  t.setAttribute('font-size','34');t.setAttribute('text-anchor','middle');
  t.textContent=chr;g.append(t);

/* カゴの口の位置（画面座標）。SVG内の口の楕円をそのまま測る */
function basketMouth(){
  const m=$('#bkMouth');
  if(!m)return{x:basketX,y:H*.7,depth:40};
  const r=m.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,depth:r.width*(16/104)};  /* 口の直径104に対し16ぶん沈める */
}
function catchIt(e,tapped){
  if(!e.alive||roundOver)return;
  const el=e.el,csz=itemSize()*e.sc,m=basketMouth(),dur=tapped?.34:.24;
  /* カゴへ吸い込まれる動きを見せたいので、要素は残したままループの対象から外す。
     カゴ(z-index 8)は#stage(5)より手前なので、沈むと自然にカゴの中へ隠れる */
  e.alive=false;ents=ents.filter(x=>x!==e);
  el.style.pointerEvents='none';
  el.style.transition=`transform ${dur}s cubic-bezier(.35,.05,.6,1),opacity ${dur}s ease-in`;
  el.style.transform=`translate(${m.x-csz/2}px,${m.y+m.depth-csz/2}px) scale(.55)`;
  el.style.opacity='0';   /* 消えると同時に、カゴの中に同じものが現れる */
  timers.push(setTimeout(()=>el.remove(),dur*1000+60));
  timers.push(setTimeout(()=>{
    const svg=basket.firstElementChild;
    if(svg){svg.classList.remove('catchPop');void svg.offsetWidth;svg.classList.add('catchPop')}
    putInBasket(e.chr);                       /* カゴの中に実際に置く */
    burst(basketMouth().x,m.y,THEMES[theme].pop,6);
    if(!tapped)thunk();
  },dur*1000*.72));
  tapSound();gotOne();
  if(!roundOver)timers.push(setTimeout(spawnCatch,500/spd()));
}
function popIt(e){
  if(!e.alive||roundOver)return;
  const bubble=e.el.querySelector('.bbl')!==null;
  burst(e.x,e.y,e.gold?'🌟':(bubble?'💧':THEMES[theme].pop),e.gold?12:8);
  if(!e.gold&&e.chr)burst(e.x,e.y,e.chr,3);
  if(e.gold){sparkleUp()}else{popSound(bubble)}
  removeEnt(e);gotOne(e.gold?2:1);                   // 金の星は⭐2つぶん
  if(!roundOver)timers.push(setTimeout(spawnBalloon,380/spd()));
}

/* ================= race (疑似3Dレース) ================= */
const car=$('#car');
let rcnv=null,rctx=null,camZ=0,playerX=0,rstars=[];
const RROWS=230,MINT=.048,ZSC=40;
const curveFn=z=>3.3*Math.sin(z*.006)+2.3*Math.sin(z*.013)+1.1*Math.sin(z*.021);
function newStar(rel){return{rel,lane:[-1,0,1][Math.floor(Math.random()*3)],gold:Math.random()<DIFF.gold[dif()]}}
const NPC_COLORS=[['#4A90D9','#2E6394'],['#F0B429','#B8860B'],['#7FCE96','#4E9A69'],['#C39AEC','#8B5FC7']];
let rnpc=[];
function newNpc(rel){
  return{rel,lane:[-1,0,1][Math.floor(Math.random()*3)],
    c:NPC_COLORS[Math.floor(Math.random()*NPC_COLORS.length)],
    sp:.5+Math.random()*.15,passed:false};
}
function drawNpc(ctx,x,y,w,c){
  const h=w*.6;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,w*.5,Math.max(1.5,h*.08),0,0,7);ctx.fill();
  ctx.fillStyle='#1E1A17';
  ctx.fillRect(x-w*.5,y-h*.34,w*.16,h*.34);
  ctx.fillRect(x+w*.34,y-h*.34,w*.16,h*.34);
  ctx.fillStyle=c[1];ctx.fillRect(x-w*.3,y-h*.95,w*.6,h*.45);
  ctx.fillStyle='#9CC8E0';ctx.fillRect(x-w*.24,y-h*.88,w*.48,h*.3);
  ctx.fillStyle=c[0];ctx.fillRect(x-w*.44,y-h*.58,w*.88,h*.52);
  ctx.fillStyle='#FFD34D';
  ctx.fillRect(x-w*.4,y-h*.44,w*.12,h*.12);
  ctx.fillRect(x+w*.28,y-h*.44,w*.12,h*.12);
  ctx.fillStyle='#FFF6DE';ctx.fillRect(x-w*.1,y-h*.28,w*.2,h*.12);
}
function passHorn(){ensureAC();tone(392,{dur:.12,type:'square',v:.4});tone(494,{delay:.11,dur:.18,type:'square',v:.4});
  tone(300,{dur:.3,type:'sine',v:.5,to:900})}
function setupRace(){
  camZ=0;playerX=0;
  rcnv=document.createElement('canvas');
  rcnv.width=W;rcnv.height=H;
  rcnv.style.cssText='position:absolute;left:0;top:0;z-index:4';
  stage.append(rcnv);rctx=rcnv.getContext('2d');
  rstars=[];for(let i=0;i<5;i++)rstars.push(newStar(8+i*7));
  rnpc=[newNpc(14),newNpc(30)];
  car.style.left='50%';car.style.transform='translateX(-50%)';
}
function drawRace(dt){
  if(rcnv.width!==W||rcnv.height!==H){rcnv.width=W;rcnv.height=H}
  const v=(85+18*dif())*spd();
  camZ+=v*dt;
  const ptx=Math.max(-1.25,Math.min(1.25,(basketTX-W/2)/(W*.3)));
  playerX+=(ptx-playerX)*Math.min(1,dt*6);
  const ctx=rctx,horizon=H*.4,roadHalf=W*.52,cNow=curveFn(camZ);
  /* 空・太陽・山(カーブと逆に流れるパララックス) */
  ctx.fillStyle='#CFE9F8';ctx.fillRect(0,0,W,horizon+2);
  ctx.fillStyle='#FFF3C4';ctx.beginPath();ctx.arc(W*.72-cNow*26,horizon*.42,H*.055,0,7);ctx.fill();
  ctx.fillStyle='#B5DFA0';
  ctx.beginPath();ctx.ellipse(W*.2-cNow*60,horizon+2,W*.42,H*.095,0,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.ellipse(W*.8-cNow*60,horizon+2,W*.44,H*.12,0,Math.PI,0);ctx.fill();
  /* 道路(下→地平線へスキャンライン描画) */
  const rows=[];let dx=0,xoff=0;
  const K=W*0.0000016;
  const rowH=(H-horizon)/RROWS+1.5;
  for(let i=0;i<RROWS;i++){
    const t=1-(i/RROWS)*(1-MINT);
    const y=horizon+(H-horizon)*t;
    const rel=1/t,zW=camZ+rel*ZSC;
    dx+=curveFn(zW)*K;xoff+=dx;
    const center=W/2+xoff;
    const half=roadHalf*t+3;
    const band=Math.floor(zW/(ZSC*.9))%2;
    ctx.fillStyle=band?'#9CCF8B':'#8AC47E';ctx.fillRect(0,y,W,rowH);
    ctx.fillStyle=band?'#E85E4A':'#FFF6DE';ctx.fillRect(center-half,y,half*2,rowH);
    const ih=half*.9;
    ctx.fillStyle=band?'#8B98A8':'#84919F';ctx.fillRect(center-ih,y,ih*2,rowH);
    if(band){ctx.fillStyle='#FFF6DE';
      ctx.fillRect(center-ih*.34-3*t,y,6*t,rowH);
      ctx.fillRect(center+ih*.34-3*t,y,6*t,rowH);}
    rows[i]={y,center,half:ih,t};
  }
  /* 車の位置(高さは画面下から7vh) */
  const carY=H-H*.07-car.offsetHeight*.5;
  const tCar=Math.min(1,Math.max(MINT,(carY-horizon)/(H-horizon)));
  const iCar=Math.min(RROWS-1,Math.max(0,Math.round(((1-tCar)/(1-MINT))*RROWS)));
  const carRow=rows[iCar];
  const carX=carRow.center+playerX*carRow.half*.6;
  /* 遅い車(追い抜き)。設定でON/OFF */
  if(saved.settings.npc){
    const wBase=Math.max(140,Math.min(225,W*.18));
    for(const nc of rnpc){
      nc.rel-=v*(1-nc.sp)*dt/ZSC;
      /* 追い抜き中はプレイヤーの走行レーンを避け、車同士が重ならないようにする */
      if(nc.rel<=1/tCar+1.15){
        const nearLane=Math.max(-1,Math.min(1,Math.round(playerX*1.35)));
        if(nc.lane===nearLane){
          const choices=[-1,0,1].filter(l=>l!==nearLane);
          nc.lane=choices[Math.floor(Math.random()*choices.length)];
        }
      }
      if(!nc.passed&&nc.rel<=1/tCar){
        nc.passed=true;passHorn();
        const sx=carRow.center+nc.lane*carRow.half*.55;
        burst(sx,carY,'💨',5);
      }
      if(nc.rel<=.7){
        nc.rel=22+Math.random()*18;nc.lane=[-1,0,1][Math.floor(Math.random()*3)];
        nc.c=NPC_COLORS[Math.floor(Math.random()*NPC_COLORS.length)];
        nc.sp=.5+Math.random()*.15;nc.passed=false;
        continue;
      }
      const t=1/nc.rel;
      if(t<.075||t>1)continue;
      const i=Math.min(RROWS-1,Math.max(0,Math.round(((1-t)/(1-MINT))*RROWS)));
      const r=rows[i];
      drawNpc(rctx,r.center+nc.lane*r.half*.55,r.y,wBase*t,nc.c);
    }
  }
  /* 星(奥から迫ってくる・車の高さで判定) */
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const st of rstars){
    st.rel-=v*dt/ZSC;
    if(st.rel<=1/tCar+.02){
      const sx=carRow.center+st.lane*carRow.half*.55;
      if(!roundOver&&Math.abs(sx-carX)<car.offsetWidth*[.9,.72,.56][dif()]){
        burst(sx,carY,'✨',st.gold?12:7);
        ensureAC();vroom(1.05);tone(NOTES[score%6]*2,{dur:.2,type:'sine',v:.5});
        if(st.gold)sparkleUp();
        gotOne(st.gold?2:1);
      }
      st.rel=18+Math.random()*22;st.lane=[-1,0,1][Math.floor(Math.random()*3)];
      st.gold=Math.random()<DIFF.gold[dif()];
      continue;
    }
    const t=1/st.rel;
    if(t<.075)continue;  /* 遠すぎる星は描かない(地平線で重なるのを防止) */
    const i=Math.min(RROWS-1,Math.max(0,Math.round(((1-t)/(1-MINT))*RROWS)));
    const r=rows[i];
    const sx=r.center+st.lane*r.half*.55;
    ctx.font=`${Math.max(14,itemSize()*t*1.15)}px sans-serif`;
    ctx.fillText(st.gold?'🌟':'⭐',sx,r.y);
  }
  /* 車を道路の上に配置(路面に沿う+走行振動) */
  const bob=Math.sin(camZ*.55)*1.6+Math.sin(camZ*1.3)*.8;
  car.style.left=carX+'px';
  car.style.transform=`translateX(-50%) translateY(${bob}px) rotate(${(ptx-playerX)*14+cNow*1.6}deg)`;
}

function attachDrag(el,type,homeX,homeY){

function attachColorDrag(el,color,homeX,homeY,bs){

  });

    if(!dragging)return;
    el.style.left=ev.clientX+'px';el.style.top=ev.clientY+'px';

/* ================= cards (トランプあわせ・形はめ方式) ================= */
const CARD_SUITS=[
  {symbol:'♥',color:'red',label:'ハート'},{symbol:'♦',color:'red',label:'ダイヤ'},
  {symbol:'♣',color:'black',label:'クラブ'},{symbol:'♠',color:'black',label:'スペード'}
];
const CARD_RANKS=['2','3','4','5','6','7','8','9','10'];
let cardMatchCards=[],cardMatchSlots=[],cardMatchSelected=null,cardMatchToken=0;
function shuffleCardFit(list){
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  return list;
}
function makeCardFitSet(n){
  const ranks=shuffleCardFit([...CARD_RANKS]).slice(0,2);
  const suits=shuffleCardFit(CARD_SUITS.map(s=>({...s}))).slice(0,2);
  return shuffleCardFit(ranks.flatMap(rank=>suits.map(suit=>({
    ...suit,rank,key:`${rank}${suit.symbol}`,cardLabel:`${suit.label}の${rank}`
  })))).slice(0,n);
}
function cardFaceHTML(card){
  return `<span class="cardCorner"><b>${card.rank}</b><span>${card.symbol}</span></span>
    <span class="cardCenter">${card.symbol}</span>
    <span class="cardCorner bottom"><b>${card.rank}</b><span>${card.symbol}</span></span>`;
}
function buildCardMatchRound(){
  if(roundOver||!running||game!=='cards'||!$('#play').classList.contains('on'))return;
  cardMatchToken++;const token=cardMatchToken;
  stage.querySelectorAll('.cardFitBoard').forEach(e=>e.remove());
  cardMatchCards=[];cardMatchSlots=[];cardMatchSelected=null;
  const n=W<370?3:4,set=makeCardFitSet(n);
  const targets=shuffleCardFit(set.map(card=>({...card})));
  const pieces=shuffleCardFit(set.map(card=>({...card})));
  if(n>1&&pieces.every((card,i)=>card.key===targets[i].key))pieces.push(pieces.shift());
  const board=document.createElement('div');board.className='cardFitBoard';
  board.style.setProperty('--card-count',n);board.setAttribute('role','group');board.setAttribute('aria-label','トランプあわせ');
  const targetRow=document.createElement('div');targetRow.className='cardFitRow cardFitTargets';
  targets.forEach(card=>{
    const slot=document.createElement('div');slot.className='cardFitSlot';slot.tabIndex=0;
    slot.setAttribute('role','button');slot.dataset.key=card.key;
    slot.setAttribute('aria-label',`${card.cardLabel}、上の見本`);
    slot.innerHTML=`<span class="playingCard cardFitPreview ${card.color}" aria-hidden="true">${cardFaceHTML(card)}</span>`;
    const data={key:card.key,el:slot,filled:false};cardMatchSlots.push(data);
    slot.addEventListener('pointerdown',ev=>ev.stopPropagation());
    slot.addEventListener('click',ev=>{ev.stopPropagation();fitSelectedCard(data,token)});
    slot.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fitSelectedCard(data,token)}
    });
    targetRow.append(slot);
  });
  const guide=document.createElement('div');guide.className='cardFitGuide';guide.setAttribute('aria-hidden','true');guide.textContent='↑';
  const pieceRow=document.createElement('div');pieceRow.className='cardFitRow cardFitPieces';
  pieces.forEach(card=>{
    const home=document.createElement('div');home.className='cardFitHome';
    const piece=document.createElement('button');piece.type='button';
    piece.className=`playingCard cardFitPiece ${card.color}`;piece.dataset.key=card.key;
    piece.dataset.cardLabel=card.cardLabel;piece.setAttribute('aria-label',`${card.cardLabel}、下のカード`);
    piece.setAttribute('aria-pressed','false');piece.innerHTML=cardFaceHTML(card);
    home.append(piece);pieceRow.append(home);cardMatchCards.push(piece);
    attachCardFitInput(piece,home,token);
  });
  board.append(targetRow,guide,pieceRow);stage.append(board);
}
function selectCardFitPiece(piece){
  if(piece.classList.contains('placed')||roundOver)return;
  if(cardMatchSelected===piece){
    piece.classList.remove('selected');piece.setAttribute('aria-pressed','false');cardMatchSelected=null;return;
  }
  if(cardMatchSelected){cardMatchSelected.classList.remove('selected');cardMatchSelected.setAttribute('aria-pressed','false')}
  cardMatchSelected=piece;piece.classList.add('selected');piece.setAttribute('aria-pressed','true');
}
function fitSelectedCard(target,token){
  if(token!==cardMatchToken||roundOver||!running||target.filled||!cardMatchSelected)return;
  if(cardMatchSelected.dataset.key===target.key)placeCardFitPiece(cardMatchSelected,target,token);
}
function nearestCardFitSlot(x,y){
  let best=null,bestD=Infinity;
  cardMatchSlots.forEach(slot=>{
    if(slot.filled)return;
    const r=slot.el.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.right)/2,y-(r.top+r.bottom)/2);
    if(d<bestD){bestD=d;best={slot,r}}
  });
  if(!best)return null;
  const limit=Math.hypot(best.r.width,best.r.height)*[.64,.5,.4][dif()];
  return bestD<=limit?best.slot:null;
}
function returnCardFitPiece(piece){
  piece.classList.remove('drag');piece.style.transform='';
}
function placeCardFitPiece(piece,target,token){
  if(token!==cardMatchToken||roundOver||!running||target.filled||piece.classList.contains('placed'))return;
  target.filled=true;target.el.classList.add('filled');target.el.removeAttribute('role');target.el.tabIndex=-1;
  piece.classList.remove('drag','selected');piece.classList.add('placed');piece.setAttribute('aria-pressed','false');
  piece.setAttribute('aria-disabled','true');piece.setAttribute('aria-label',`${piece.dataset.cardLabel}、そろった`);
  if(cardMatchSelected===piece)cardMatchSelected=null;
  const home=piece.parentElement,hr=home.getBoundingClientRect(),tr=target.el.getBoundingClientRect();
  piece.style.transform=`translate(${(tr.left+tr.right-hr.left-hr.right)/2}px,${(tr.top+tr.bottom-hr.top-hr.bottom)/2}px) scale(.96)`;
  timers.push(setTimeout(()=>{
    if(token!==cardMatchToken||!target.el.isConnected||!piece.isConnected)return;
    target.el.append(piece);piece.style.transform='';piece.classList.add('settled');
    const r=target.el.getBoundingClientRect();burst((r.left+r.right)/2,(r.top+r.bottom)/2,'✨',8);sparkleUp();tapSound();gotOne();
    if(!roundOver&&cardMatchCards.every(card=>card.classList.contains('settled'))){
      timers.push(setTimeout(buildCardMatchRound,850/spd()));
    }
  },300/spd()));
}
function attachCardFitInput(piece,home,token){
  let pointerId=null,startX=0,startY=0,moved=false,suppressClick=false;
  piece.addEventListener('pointerdown',ev=>{
    if(token!==cardMatchToken||roundOver||!running||piece.classList.contains('placed'))return;
    pointerId=ev.pointerId;startX=ev.clientX;startY=ev.clientY;moved=false;
    if(cardMatchSelected){cardMatchSelected.classList.remove('selected');cardMatchSelected.setAttribute('aria-pressed','false');cardMatchSelected=null}
    try{piece.setPointerCapture(ev.pointerId)}catch(e){}
    ev.preventDefault();ev.stopPropagation();
  });
  piece.addEventListener('pointermove',ev=>{
    if(ev.pointerId!==pointerId)return;
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(!moved&&Math.hypot(dx,dy)<8)return;
    moved=true;piece.classList.add('drag');piece.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;
  });
  const finish=ev=>{
    if(ev.pointerId!==pointerId)return;
    const didMove=moved;pointerId=null;
    try{piece.releasePointerCapture(ev.pointerId)}catch(e){}
    if(!didMove){
      returnCardFitPiece(piece);suppressClick=true;selectCardFitPiece(piece);
      setTimeout(()=>suppressClick=false,0);return;
    }
    suppressClick=true;setTimeout(()=>suppressClick=false,0);
    const target=nearestCardFitSlot(ev.clientX,ev.clientY);
    if(target&&target.key===piece.dataset.key)placeCardFitPiece(piece,target,token);
    else returnCardFitPiece(piece);
  };
  piece.addEventListener('pointerup',finish);
  piece.addEventListener('pointercancel',ev=>{if(ev.pointerId===pointerId){pointerId=null;returnCardFitPiece(piece)}});
  piece.addEventListener('click',ev=>{
    ev.stopPropagation();
    if(suppressClick){suppressClick=false;return}
    if(token===cardMatchToken&&piece.parentElement===home)selectCardFitPiece(piece);
  });
}

/* ================= main loop ================= */
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  if(!running)return;
  const s=spd();
  if(game==='catch'){
    basketX+=(basketTX-basketX)*Math.min(1,dt*10);
    const bw=basket.offsetWidth;
    basket.style.transform=`translateX(${basketX-bw/2}px)`;
    const topY=H-basket.offsetHeight-H*.02;
    for(const e of [...ents]){
      const csz=itemSize()*e.sc;
      e.y+=e.vy*s*dt;e.ph+=dt*2;
      const x=e.x+Math.sin(e.ph)*e.amp*.4;
      e.el.style.transform=`translate(${x-csz/2}px,${e.y-csz/2}px) rotate(${Math.sin(e.ph)*10}deg)`;
      if(e.y>topY&&e.y<topY+H*.12&&Math.abs(x-basketX)<bw*DIFF.catchW[dif()]){catchIt(e,false);continue}
      if(e.y>H+itemSize()){removeEnt(e);timers.push(setTimeout(spawnCatch,600/s))}
    }
  }else if(game==='pinball'){
    if(pinCanvas&&pinCanvas.isConnected){updatePinball(dt);drawPinball()}
  }else if(game==='race'){
    if(rcnv&&rcnv.isConnected)drawRace(dt);
  }else if(game==='balloon'){
    for(const e of ents){
      const sz=itemSize()*e.sc;
      e.y-=e.vy*s*dt;e.ph+=dt*1.8;
      const x=e.x+Math.sin(e.ph)*e.amp*.5;
      e.el.style.transform=`translate(${x-sz/2}px,${e.y-sz/2}px) rotate(${Math.sin(e.ph)*8}deg)`;
      if(e.y<-sz){e.y=H+sz;e.x=sz/2+Math.random()*(W-sz)}
    }
  }
}
requestAnimationFrame(loop);

  if(game==='pinball'){

  }else if(game==='race'){

    setupRace();
  }else if(game==='catch'){

    for(let i=0;i<3;i++)timers.push(setTimeout(spawnCatch,i*700/spd()));
  }else if(game==='race'){
    if(rcnv&&rcnv.isConnected)drawRace(dt);
  }else if(game==='balloon'){

  }else if(game==='mole'){
    buildHoles();timers.push(setTimeout(moleUp,500/spd()));
  }else if(game==='color'){
    buildColorRound();
  }else if(game==='cards'){
    buildCardMatchRound();
  }else{
    buildMatchRound();
  }
}
const moveBasket=ev=>{if(running&&(game==='catch'||game==='race'))basketTX=Math.max(60,Math.min(W-60,ev.clientX))};
stage.addEventListener('pointerdown',moveBasket);
stage.addEventListener('pointermove',ev=>{if(ev.pressure>0||ev.pointerType==='touch')moveBasket(ev)});

/* ================= reward / gacha ================= */
let gachaPhase='idle';
const hand=$('#hand'),capsule=$('#capsule');
function placeHand(where){
  if(where==='knob'){hand.style.left='56%';hand.style.top='60%'}
  else{hand.style.left='58%';hand.style.top='78%'}
  hand.classList.add('show');
}
function enterReward(){
  saved.coins++;persist();
  show('reward');gachaPhase='idle';
  $('#cardBox').classList.remove('on');
  capsule.className='';$('#knob').classList.remove('turn');
  placeHand('knob');
  const c=$('#flyCoin');c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
  ensureAC();tone(NOTES[2],{dur:.3});tone(NOTES[4],{delay:.15,dur:.35});
}
$('#machineBtn').addEventListener('pointerdown',()=>{
  if(gachaPhase!=='idle')return;gachaPhase='turning';
  hand.classList.remove('show');ensureAC();
  const m=1/spd();
  $('#knob').classList.add('turn');ratchet();
  timers.push(setTimeout(()=>{
    capsule.classList.add('drop');poyon();
    const r=capsule.getBoundingClientRect(),w=$('#machineWrap').getBoundingClientRect();
    burst(r.left-w.left+r.width/2,r.top-w.top+r.height/2,'✨',8,$('#machineWrap'));
  },600*m));
  timers.push(setTimeout(()=>{
    capsule.classList.add('wob');gachaPhase='capsule';placeHand('capsule');
    timers.push(setTimeout(()=>{if(gachaPhase==='capsule')openCapsule()},4200*m));
  },1450*m));
});
capsule.addEventListener('pointerdown',ev=>{ev.stopPropagation();if(gachaPhase==='capsule')openCapsule()});
function openCapsule(){
  gachaPhase='opened';hand.classList.remove('show');
  /* 1. カプセルが手前にわーんと拡大 */
  capsule.classList.remove('wob');capsule.classList.add('zoom');whoosh();
  timers.push(setTimeout(()=>{
    /* 2. 大きくなったところでパカッと開く */
    capsule.classList.add('open');crack();
    const r=capsule.getBoundingClientRect(),w=$('#machineWrap').getBoundingClientRect();
    burst(r.left-w.left+r.width/2,r.top-w.top+r.height/2,'🎊',12,$('#machineWrap'));
    timers.push(setTimeout(()=>{
      const item=CARDS[Math.floor(Math.random()*CARDS.length)];
      if(!saved.cards.includes(item))saved.cards.push(item);persist();
      $('#bigCard').textContent=item;$('#cardBox').classList.add('on');fanfare();
    },520/spd()));
  },600/spd()));
}
$('#againPlay').onclick=()=>startPlay();
$('#cardBookBtn').onclick=()=>{renderBook();show('book')};

/* ================= book ================= */
function renderBook(){
  const g=$('#bookGrid');g.innerHTML='';
  CARDS.forEach(item=>{
    const d=document.createElement('div');
    d.className='bookCard'+(saved.cards.includes(item)?'':' locked');
    d.innerHTML=`<span>${item}</span>`;g.append(d);
  });
}

/* ================= wiring ================= */
function buildActivityCategories(){
  const source=$('#activityCards');if(!source)return;
  const groups=[
    {label:'ゲーム',items:['[data-game="catch"]','[data-game="balloon"]','[data-game="mole"]','[data-game="race"]','[data-game="pinball"]']},
    {label:'学習',items:['[data-game="match"]','[data-game="color"]','[data-game="cards"]','#openDrawing']},
    {label:'音楽',items:['#openMusic','#openDrums']}
  ];
  const wrap=document.createElement('div');wrap.id='gameCategories';
  groups.forEach(group=>{
    const section=document.createElement('section');section.className='gameCategory';section.setAttribute('aria-label',group.label);
    const title=document.createElement('h3');title.className='categoryTitle';title.textContent=group.label;
    const row=document.createElement('div');row.className='cardRow';
    group.items.forEach(selector=>{const item=source.querySelector(selector);if(item)row.append(item)});
    section.append(title,row);wrap.append(section);
  });
  source.replaceWith(wrap);
}
buildActivityCategories();
$('#startBtn').onclick=()=>show('games');
$('#startBook').onclick=()=>{renderBook();show('book')};
$$('.theme').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;ensureAC();tapSound();startPlay()});
$$('.game').forEach(b=>b.onclick=()=>{game=b.dataset.game;if(['catch','balloon','mole'].includes(game))show('character');else startPlay()});
$('#openMusic').onclick=()=>{ensureAC();show('music');playSynthNote(0,.35)};
$('#backMusic').onclick=()=>show('games');
initDrawingPalette();
$('#openDrawing').onclick=()=>show('drawing');
$('#backDrawing').onclick=()=>{resetClearDrawing();show('games')};
$('#openDrums').onclick=()=>{ensureAC();show('drums')};
$('#backDrums').onclick=()=>show('games');
$$('.drumPad').forEach(b=>b.addEventListener('pointerdown',ev=>{ev.preventDefault();playDrum(b.dataset.drum,b)}));
drawCanvas.addEventListener('pointerdown',beginDrawing);
drawCanvas.addEventListener('pointermove',moveDrawing);
['pointerup','pointercancel','pointerleave'].forEach(type=>drawCanvas.addEventListener(type,endDrawing));
$$('.brushSize').forEach(b=>b.onclick=()=>{
  drawWidthIndex=Number(b.dataset.size);drawingEraser=false;
  $$('.brushSize').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});
  $$('.colorDot').forEach(x=>{const on=x.dataset.color===drawColor;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});
  $('#drawEraser').classList.remove('active');$('#drawEraser').setAttribute('aria-pressed','false');
  ensureAC();tone(360+drawWidthIndex*90,{dur:.1,type:'sine',v:.3});
});
$('#drawEraser').onclick=()=>{
  drawingEraser=true;$$('.colorDot,.brushSize').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});
  const b=$('#drawEraser');b.classList.add('active');b.setAttribute('aria-pressed','true');
  ensureAC();tone(330,{dur:.12,type:'sine',v:.35});
};
$('#clearDrawing').onclick=()=>{
  const b=$('#clearDrawing');
  if(!clearDrawingArmed){
    clearDrawingArmed=true;b.classList.add('armed');b.textContent='⚠️';
    clearDrawingTimer=setTimeout(resetClearDrawing,3500);return;
  }
  clearDrawing();
};
$$('.pianoKey').forEach(b=>b.addEventListener('pointerdown',ev=>{ev.preventDefault();playSynthNote(b.dataset.note)}));
$$('.synthChoice').forEach(b=>b.onclick=()=>{
  synthWave=b.dataset.wave;
  $$('.synthChoice').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});
  playSynthNote({sine:0,triangle:2,sawtooth:4}[synthWave],.4);
});
$('#musicAuto').onclick=toggleMusicAuto;
$$('.homeBtn').forEach(b=>b.onclick=()=>show('start'));
$('#backGames').onclick=()=>show('games');
$('#backGamesFromCharacter').onclick=()=>show('games');
$('#openBook').onclick=$('#rewardBook').onclick=()=>{renderBook();show('book')};

$$('.levels').forEach(box=>{
  box.dataset.labels.split(',').forEach((label,i)=>{
    const b=document.createElement('button');b.className='level';b.textContent=label;
    b.onclick=()=>{saved.settings[box.dataset.key]=i;persist();applySettings();ensureAC();tone(NOTES[i%6])};
    box.append(b);
  });
});
let clearBookArmed=false,clearBookTimer=0;
function resetClearBookButton(){
  clearTimeout(clearBookTimer);clearBookArmed=false;
  const b=$('#clearBookBtn');b.classList.remove('armed');b.textContent='🗑️ クリア';
}
$('#clearBookBtn').onclick=()=>{
  const b=$('#clearBookBtn');
  if(!clearBookArmed){
    clearBookArmed=true;b.classList.add('armed');b.textContent='もう一度押すとクリア';
    clearBookTimer=setTimeout(resetClearBookButton,4000);return;
  }
  clearTimeout(clearBookTimer);clearBookArmed=false;b.classList.remove('armed');
  saved.cards=[];persist();renderBook();ensureAC();sparkleUp();
  b.textContent='クリアしました';clearBookTimer=setTimeout(resetClearBookButton,2200);
};
/* ⚙️ボタン: タップで職員用設定 */
$('#gearBtn').addEventListener('pointerdown',()=>$('#settings').classList.add('open'));
let holdTimer;const holdBtn=$('#staffHold');
holdBtn.addEventListener('pointerdown',()=>holdTimer=setTimeout(()=>$('#settings').classList.add('open'),3000));
['pointerup','pointercancel','pointerleave'].forEach(x=>holdBtn.addEventListener(x,()=>clearTimeout(holdTimer)));
$('.closeSettings').onclick=()=>{resetClearBookButton();$('#settings').classList.remove('open')};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    running=false;stopBGM();stopMusicAuto();
    if(game==='pinball'){
      pinPointers.left.clear();pinPointers.right.clear();pinCanvasPointers.clear();
      pinKeys.left=false;pinKeys.right=false;
    }
  }
  else{
    if($('#play').classList.contains('on')&&!roundOver)running=true;
    if(!$('#music').classList.contains('on')&&!$('#drums').classList.contains('on'))startBGM();
  }
});
/* タイトルの1文字ずつゆれ */
(()=>{const t=$('#titleTxt');if(!t)return;const s=t.textContent;t.textContent='';
  [...s].forEach((ch,i)=>{const sp=document.createElement('span');sp.className='tch';
    sp.textContent=ch;sp.style.animationDelay=(i*.14)+'s';t.append(sp)})})();
document.addEventListener('pointerdown',()=>{if(!$('#music').classList.contains('on')&&!$('#drums').classList.contains('on'))startBGM()});
applySettings();
})();
</script>
