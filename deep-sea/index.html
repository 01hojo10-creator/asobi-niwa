<body><canvas id="sea" aria-label="潜水艇の窓から見た3Dの海底"></canvas><div id="viewport"></div><div id="flash"></div>
<header><div class="brand"><span class="mark">◈</span><div><h1>深海観測</h1><div id="zone">調査船</div></div></div><div id="mission" hidden><span>今回の記録</span><strong id="count">0 / 5</strong></div><nav><button id="map">海域マップ</button><button id="openbook">図鑑 <span id="total">0 / 60</span></button><button id="mute" aria-pressed="false">音あり</button><button id="home" hidden>帰港</button></nav></header>
<div id="hud" hidden><div id="reticle"></div><div id="cue" role="status"></div><button id="course" hidden title="案内を終了"><span id="courseArrow">▲</span><span id="courseText"></span></button><aside id="scanner"><button id="sonarToggle" aria-expanded="true">ソナー <span>R</span></button><div id="scanBody"><canvas id="radar" width="168" height="168" aria-label="進行方向基準のソナー"></canvas><p id="reading">観測中</p></div></aside><footer><div class="depth"><small>深度</small><strong id="depth">0</strong> m <span id="integrity"></span></div><div class="controls"><button id="lamp" aria-pressed="true">ライト <kbd>F</kbd></button><button id="drone" hidden aria-pressed="false">ドローン</button><button id="overhead" aria-pressed="false"><span id="overheadText">見下ろす</span> <kbd>V</kbd></button><button id="snap">撮影 <kbd>E</kbd></button></div><p>ドラッグで見回す · WASD 移動 · Q / Z 上下</p></footer><div id="touch"><button data-key="a" aria-label="左に移動">←</button><button data-key="w" aria-label="前進">↑</button><button data-key="s" aria-label="後退">↓</button><button data-key="d" aria-label="右に移動">→</button><button data-key="q">浮上</button><button data-key="z">潜降</button></div></div>
<main id="start" class="overlay"><section class="card start-card"><h2>深海観測</h2><p>潜水艇に乗り、海底を巡る。<br>ソナーの反応をたどり、生き物を撮影する。</p><label for="goal">今回の目標 <span><input id="goal" type="number" value="5" min="1" max="60" inputmode="numeric"> 種類</span></label><button class="primary" id="launch">潜航する</button><a class="yard-link" href="../#games">あそびのにわへ戻る</a><small id="startStatus">図鑑はこのブラウザーに保存されます</small></section></main>
<dialog id="chart"><div class="dialog-title"><div><h2>海域マップ</h2><p>海域を選んで潜航できます。</p></div><button data-close="chart" autofocus>閉じる</button></div><div id="chartSites"></div></dialog><dialog id="book"><div class="dialog-title"><div><h2>観察図鑑</h2><p id="bookProgress"></p></div><button data-close="book" autofocus>閉じる</button></div><div id="species"></div></dialog>
<dialog id="result"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-buttons"><button id="continue">探索を続ける</button><button id="dock" class="primary">帰港する</button></div></dialog>
<dialog id="detail"><button data-close="detail">閉じる</button><h2 id="detailTitle"></h2><img id="photo" alt=""></dialog>

  radar.clearRect(0,0,168,168);
  radar.fillStyle='#061923';
  radar.beginPath();radar.arc(cx,cy,77,0,tau);radar.fill();
  radar.strokeStyle='#3b726f';radar.lineWidth=1;
  for(const r of [25,50,76]){radar.beginPath();radar.arc(cx,cy,r,0,tau);radar.stroke();}
  radar.strokeStyle='#31514e';radar.beginPath();radar.moveTo(8,84);radar.lineTo(160,84);radar.moveTo(84,8);radar.lineTo(84,160);radar.stroke();
  radar.strokeStyle='#79e4c3';radar.lineWidth=1;
  radar.beginPath();radar.moveTo(cx,cy-6);radar.lineTo(cx-4,cy+4);radar.lineTo(cx+4,cy+4);radar.closePath();radar.stroke();
  radar.strokeStyle='rgba(94,239,191,'+Math.max(0,(1-pingRing)*.63)+')';
  radar.beginPath();radar.arc(cx,cy,Math.max(1,pingRing*76),0,tau);radar.stroke();
  if(!target){$('reading').textContent=discoveries.size===totalSpecies?'全種類を観察':'周囲を走査中';return;}
  const d=sub(target.pos,camera.pos);
  const forward=dot(d,[sin(camera.yaw),0,-cos(camera.yaw)]), side=dot(d,[cos(camera.yaw),0,sin(camera.yaw)]);
  const bearing=Math.atan2(side,forward);
  const rr=clamp(length(forward,side)*1.63,8,70), xx=cx+sin(bearing)*rr, yy=cy-cos(bearing)*rr;
  const halo=radar.createRadialGradient(xx,yy,0,xx,yy,14);
  halo.addColorStop(0,'#a9ffe0');halo.addColorStop(.27,'#54e8bca3');halo.addColorStop(1,'#54e8bc00');
  radar.fillStyle=halo;radar.fillRect(xx-14,yy-14,28,28);
  const dir=forward<0&&Math.abs(side)<-forward*.82?'後方':Math.abs(side)<3||Math.abs(bearing)<.28?'正面':side>0?'右':'左';
  const vertical=Math.abs(d[1])<2?'同じ高さ':d[1]>0?'上':'下';
  $('reading').textContent=dir+'・'+vertical+' 約 '+Math.max(1,Math.round(distance))+' m';
}
function flash(){
  const el=$('flash');
  el.style.transition='none';el.style.opacity='.65';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='opacity .4s';el.style.opacity='0';}));
}
function photograph(){
  if(!active||intro<1||$('result').open||$('book').open)return;
  if(!eligible){say('生き物を中央に捉えて、もう少し近づいてください',2.3);return;}
  const {a,screenX,screenY}=eligible;
  const output=document.createElement('canvas');output.width=360;output.height=202;
  const cx=(1+screenX)*sea.width/2,cy=(1-screenY)*sea.height/2;
  const maxW=Math.min(sea.width,sea.height*360/202);
  const w=maxW*.70,h=w*202/360;
  output.getContext('2d').drawImage(sea,clamp(cx-w/2,0,sea.width-w),clamp(cy-h/2,0,sea.height-h),w,h,0,0,360,202);
  records[a.id]={image:output.toDataURL('image/jpeg',.73)};
  const first=!discoveries.has(a.id);
  discoveries.add(a.id);refreshCounts();
  $('flash').style.background='#dfffff';flash();
  play(900,.12,.08,390);
  say(first?'撮影：'+a.name+' · '+discoveries.size+' / '+goal:'写真を更新：'+a.name,3);
  checkpoint();
  if(first&&discoveries.size>=goal&&!goalShown){
    goalShown=true;result('goal');
  }
}
function updateBook(){
  $('bookProgress').textContent=recordCount()+' / '+totalSpecies+' 種類';
  const root=$('species');root.replaceChildren();
  for(const a of species){
    const photo=records[a.id]?.image;
    const el=document.createElement(photo?'button':'div');
    el.className='specimen';
    if(photo){
      const image=new Image();image.src=photo;image.alt='';image.loading='lazy';el.append(image);
      el.addEventListener('click',()=>{
        $('detailTitle').textContent=a.name;
        $('photo').src=photo;$('photo').alt=a.name+'の観察写真';$('detail').showModal();
      });
    }
    const name=document.createElement('span');
    name.textContent=photo?a.name:'未発見';
    const area=document.createElement('small');area.textContent=areaNames[a.area];
    el.append(name,area);root.append(el);
  }
}
function setOverhead(enabled){
  overhead=enabled;
  $('overhead').setAttribute('aria-pressed',String(enabled));
  $('overheadText').textContent=enabled?'正面を見る':'見下ろす';
}
function toggleOverhead(){
  if(!active||intro<1||$('result').open)return;
  setOverhead(!overhead);
  if(overhead){
    const rise=droneMode?3:7;
    camera.pos[1]=Math.min(-.62,camera.pos[1]+rise);
    camera.vel[1]=0;
    camera.pitch=-.78;
  }else{
    camera.pitch=-.10;
  }
}
function resetInput(){keys.clear();mobileKeys.clear();drag=null;}
function isDown(key){return keys.has(key)||Array.from(mobileKeys.values()).includes(key);}
function updateDive(dt){
  diveTime+=dt;
  const {pos}=camera;
  if(intro<1){
    intro=Math.min(1,intro+dt/5.4);
    const t=intro*intro*(3-2*intro);
    pos[1]=mix(-.10,-11.15,t);pos[2]=mix(15,-9,t);
    if(intro===1)say('海底を見回す · 反応を待つ',3);
  }else{
    const throttle=Number(isDown('w'))-Number(isDown('s')), lateral=Number(isDown('d'))-Number(isDown('a'));
    const ascent=Number(isDown('q'))-Number(isDown('z'));
    const bearing=sin(camera.yaw), cross=cos(camera.yaw);
    const speed=droneMode?8.2:19.5;
    const scale=speed/(throttle&&lateral?Math.SQRT2:1);
    const want=[(bearing*throttle+cross*lateral)*scale,throttle*(overhead?0:sin(camera.pitch)*7)+ascent*8.8,(-cross*throttle+bearing*lateral)*scale];
    for(let i=0;i<3;i++) {camera.vel[i]=mix(camera.vel[i],want[i],1-Math.exp(-dt*4.2));pos[i]+=camera.vel[i]*dt;}
    pos[0]=clamp(pos[0],-120,327);pos[2]=clamp(pos[2],-670,53);
    if(droneMode&&length(...sub(pos,subPosition))>35){
      for(let i=0;i<3;i++)pos[i]=subPosition[i]+(pos[i]-subPosition[i])*.98;
    }
    pos[1]=clamp(pos[1],floorAt(pos[0],pos[2])+(droneMode?.6:1.3),-.36);
  }
  $('zone').textContent=droneMode?'観察ドローン':siteName(pos[0],pos[2]);
  showCourse();
  $('depth').textContent=Math.round(-pos[1]*(mix(11,2,clamp((pos[0]-70)/140,0,1)*clamp((pos[2]+207)/128,0,1))));
  $('integrity').textContent=hull<100?'艇体 '+hull+'%':'';
  $('drone').hidden=!droneMode&&length(pos[0]-1,pos[2]+143)>33;
  if(sonarOpen&&target&&diveTime>=nextPing){
    pingRing=.01;nextPing=diveTime+3.8;play(672,.28,.037,512);
  }
  pingRing=Math.min(1,pingRing+dt*.73);
}
function toggleDrone(){
  if($('drone').hidden||!active||intro<1)return;
  if(droneMode){camera.pos=subPosition;subPosition=null;droneMode=false;say('潜水艇に戻りました');}
  else{subPosition=camera.pos.slice();droneMode=true;say('観察ドローンを発進しました');}
  camera.vel=[0,0,0];
  $('drone').setAttribute('aria-pressed',String(droneMode));
  $('drone').textContent=droneMode?'艇に戻る':'ドローン';
}
let drag=null;
sea.addEventListener('pointerdown',event=>{
  if(!active||event.button!==0||drag)return;
  drag={id:event.pointerId,x:event.clientX,y:event.clientY};sea.setPointerCapture(event.pointerId);
});
sea.addEventListener('pointermove',event=>{
  if(!drag||drag.id!==event.pointerId)return;
  camera.yaw+=(event.clientX-drag.x)*.0061;
  camera.pitch=clamp(camera.pitch-(event.clientY-drag.y)*.0059,-1.35,1.35);
  drag.x=event.clientX;drag.y=event.clientY;
});
for(const name of ['pointercancel','lostpointercapture','pointerup']) sea.addEventListener(name,event=>{if(drag?.id===event.pointerId)drag=null;});
document.querySelectorAll('#touch button').forEach(button=>{
  button.addEventListener('pointerdown',event=>{
    event.preventDefault();
    mobileKeys.set(event.pointerId,button.dataset.key);button.setPointerCapture(event.pointerId);
  });
  for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,event=>mobileKeys.delete(event.pointerId));
});
window.addEventListener('blur',resetInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput();});
document.addEventListener('keydown',event=>{
  if(!active||$('book').open||$('result').open||$('detail').open||$('chart').open||event.ctrlKey||event.metaKey||event.altKey)return;
  const k=event.key.toLowerCase();
  if('wasdqz'.includes(k)&&k.length===1){event.preventDefault();keys.add(k);}
  if(event.repeat)return;
  if(k==='f')setLamp(!lampOn);
  if(k==='r')setSonar(!sonarOpen);
  if(k==='e')photograph();
  if(k==='v')toggleOverhead();
  if(k==='m')showChart();
});
document.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
$('launch').addEventListener('click',begin);
$('lamp').addEventListener('click',()=>setLamp(!lampOn));
$('snap').addEventListener('click',photograph);
$('overhead').addEventListener('click',toggleOverhead);
$('drone').addEventListener('click',toggleDrone);
$('sonarToggle').addEventListener('click',()=>setSonar(!sonarOpen));
$('openbook').addEventListener('click',()=>{resetInput();updateBook();$('book').showModal();});
$('home').addEventListener('click',()=>result('manual'));
$('map').addEventListener('click',showChart);
$('course').addEventListener('click',()=>{destination=null;showCourse();});
$('dock').addEventListener('click',returnHome);
$('continue').addEventListener('click',()=>$('result').close());
$('result').addEventListener('cancel',event=>{if(hull===0)event.preventDefault();});
$('mute').addEventListener('click',()=>{
  muted=!muted;$('mute').textContent=muted?'消音':'音あり';$('mute').setAttribute('aria-pressed',String(muted));
});
for(const el of document.querySelectorAll('[data-close]'))el.addEventListener('click',()=>$(el.dataset.close).close());
let before=performance.now(), cadence=0;
function frame(now){
  const dt=clamp((now-before)/1000,0,.045);before=now;
  const paused=$('book').open||$('result').open||$('detail').open||$('chart').open;
  if(!paused){
    time+=dt;
    if(active)updateDive(dt);
    updateAnimals(time);
  }
  draw();
  if(active&&!paused){
    cadence+=dt;
    if(cadence>.11){
      cadence=0;
      if(sonarOpen)updateSonar();
      $('reticle').classList.toggle('ready',Boolean(eligible)&&intro>=1);
      $('cue').textContent=time<messageUntil?message:eligible&&intro>=1?'撮影できます':'';
    }
  }
  requestAnimationFrame(frame);
}
try{init();returnHome();refreshCounts();requestAnimationFrame(frame);}
catch(error){
  bootError=error;
  console.error(error);
  $('launch').disabled=true;$('startStatus').textContent=gl?'3D画面を起動できませんでした。':error.message;
}


</script></body></html>
